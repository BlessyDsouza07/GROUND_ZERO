[project]
name = "groundzero"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["layer0/tests", "layer1/tests", "layer2/tests", "layer5/tests", "layer2_layer5_integration_tests.py"]
