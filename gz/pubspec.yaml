name: groundzero
description: GroundZero — a travel companion for Mangaluru.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_map: ^7.0.2
  flutter_svg: ^2.0.10+1
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  url_launcher: ^6.3.0
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  camera: ^0.11.0
  audioplayers: ^6.1.0
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
